version: "3"
tasks:
  test:
    desc: Run all unit tests
    cmds:
      - tape
  coverage:
    desc: |
      Run tests with subscriber scoped to the library package only.
      run.go (CLI glue) is intentionally excluded.
    cmds:
      - coverage || tape
  build:
    desc: Build the binary for the current platform
    cmds:
      - go build -o subscriber ./cmd/subscriber
  release:snapshot:
    desc: |
      Dry-run GoReleaser locally — builds all platform binaries into ./dist
      without publishing. Requires goreleaser to be installed (brew install goreleaser).
    cmds:
      - goreleaser release --snapshot --clean
  release:check:
    desc: Validate .goreleaser.yaml without building
    cmds:
      - goreleaser check
  lint:
    desc: Run go vet
    cmds:
      - golangci-lint run
  fix:lint:
    desc: Run fix lint
    cmds:
      - golangci-lint run --fix
  clean:
    desc: Remove build artefacts
    cmds:
      - rm -f subscriber subscriber.out subscriber.html
      - rm -rf dist
  run:
    desc: |
      Run subscriber against a subscriber profile.
      Usage: task run -- -f myproject.out --code-frame
    cmds:
      - go run ./cmd/subscriber {{.CLI_ARGS}}
